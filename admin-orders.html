<!doctype html>
<!-- Demonstration dashboard for viewing and managing browser-local orders. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Local Craftsvilla demonstration order-management interface." />
    <title>CRAFTSVILLA — Demonstration order administration</title>
    <link rel="stylesheet" href="style.css" />
    <script src="product-data.js" defer></script>
    <script src="admin-orders.js" defer></script>
  </head>
  <body>
    <div class="site admin-site">
      <!-- Simplified header for the local administration demonstration. -->
      <header class="admin-header">
        <a class="logo" href="index.html">CRAFTSVILLA</a>
        <a class="btn secondary" href="index.html">Return to website</a>
      </header>
      <main>
        <!-- This static demonstration page is not secure authentication or a protected administrator route. -->
        <section class="page-intro">
          <p class="eyebrow">LOCAL DEMONSTRATION</p>
          <h1>Order administration demo</h1>
          <p class="admin-warning">This page is not securely protected. Orders are demonstration data stored only in this browser.</p>
        </section>
        <section id="adminStats" class="admin-stats" aria-label="Order summary"></section>
        <!-- Search, filtering, actions, and order cards are controlled by admin-orders.js. -->
        <section class="admin-panel">
          <div class="admin-toolbar">
            <label>
              Search orders
              <input id="orderSearch" type="search" placeholder="Order ID, customer, or email" />
            </label>
            <label>
              Status
              <select id="statusFilter">
                <option value="all">All statuses</option>
              </select>
            </label>
            <label>
              Sort
              <select id="orderSort">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="highest">Highest total</option>
                <option value="lowest">Lowest total</option>
              </select>
            </label>
          </div>
          <div class="admin-actions">
            <button id="createDemoOrder" class="btn secondary" type="button">Create sample demo order</button>
            <button id="clearOrders" class="btn danger-button" type="button">Clear all demo orders</button>
          </div>
          <p id="adminMessage" class="form-notice" aria-live="polite"></p>
          <div id="orderList" class="order-list"></div>
          <div id="adminEmpty" class="empty-cart">
            <h2>No orders found</h2>
            <p>Create a sample order or complete the public checkout demonstration.</p>
          </div>
        </section>
      </main>
    </div>
    <!-- Reusable modal populated with details for the selected order. -->
    <dialog id="orderDialog" class="order-dialog" aria-labelledby="orderDialogTitle">
      <div class="order-dialog-content">
        <button id="closeOrderDialog" class="lightbox-close" type="button" aria-label="Close order details">×</button>
        <h2 id="orderDialogTitle">Order details</h2>
        <div id="orderDetails"></div>
      </div>
    </dialog>
  </body>
</html>
