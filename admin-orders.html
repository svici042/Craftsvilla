<!doctype html>
<!-- Demonstration dashboard for viewing and managing browser-local orders. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Local Craftsvilla demonstration order-management interface." />
    <title data-i18n-title="pageTitleAdmin">CRAFTSVILLA — Demonstration order administration</title>
    <link rel="stylesheet" href="style.css" />
    <script src="product-data.js" defer></script>
    <script src="nav.js" defer></script>
    <script src="admin-orders.js" defer></script>
  </head>
  <body>
    <div class="site admin-site">
      <!-- Simplified header for the local administration demonstration. -->
      <header class="admin-header">
        <a class="logo" href="index.html">CRAFTSVILLA</a>
        <div class="admin-header-actions">
          <button
            class="lang-toggle"
            id="langToggle"
            type="button"
            aria-label="Toggle language"
            data-i18n-aria-label="languageToggleLabel"
          >NO</button>
          <a class="btn secondary" href="index.html" data-i18n="adminReturnWebsite">Return to website</a>
        </div>
      </header>
      <main>
        <!-- This static demonstration page is not secure authentication or a protected administrator route. -->
        <section class="page-intro">
          <p class="eyebrow" data-i18n="adminEyebrow">LOCAL DEMONSTRATION</p>
          <h1 data-i18n="adminHeading">Order administration demo</h1>
          <p class="admin-warning" data-i18n="adminWarning">This page is not securely protected. Orders are demonstration data stored only in this browser.</p>
        </section>
        <section
          id="adminStats"
          class="admin-stats"
          aria-label="Order summary"
          data-i18n-aria-label="adminOrderSummaryLabel"
        ></section>
        <!-- Search, filtering, actions, and order cards are controlled by admin-orders.js. -->
        <section class="admin-panel">
          <div class="admin-toolbar">
            <label>
              <span data-i18n="adminSearchOrders">Search orders</span>
              <input
                id="orderSearch"
                type="search"
                placeholder="Order ID, customer, or email"
                data-i18n-placeholder="adminSearchPlaceholder"
              />
            </label>
            <label>
              <span data-i18n="adminStatus">Status</span>
              <select id="statusFilter">
                <option value="all" data-i18n="adminAllStatuses">All statuses</option>
              </select>
            </label>
            <label>
              <span data-i18n="adminSort">Sort</span>
              <select id="orderSort">
                <option value="newest" data-i18n="adminSortNewest">Newest</option>
                <option value="oldest" data-i18n="adminSortOldest">Oldest</option>
                <option value="highest" data-i18n="adminSortHighest">Highest total</option>
                <option value="lowest" data-i18n="adminSortLowest">Lowest total</option>
              </select>
            </label>
          </div>
          <div class="admin-actions">
            <button id="createDemoOrder" class="btn secondary" type="button" data-i18n="adminCreateSample">Create sample demo order</button>
            <button id="clearOrders" class="btn danger-button" type="button" data-i18n="adminClearAll">Clear all demo orders</button>
          </div>
          <p id="adminMessage" class="form-notice" aria-live="polite"></p>
          <div id="orderList" class="order-list"></div>
          <div id="adminEmpty" class="empty-cart">
            <h2 data-i18n="adminNoOrders">No orders found</h2>
            <p data-i18n="adminEmptyExplanation">Create a sample order or complete the public checkout demonstration.</p>
          </div>
        </section>
      </main>
    </div>
    <!-- Reusable modal populated with details for the selected order. -->
    <dialog id="orderDialog" class="order-dialog" aria-labelledby="orderDialogTitle">
      <div class="order-dialog-content">
        <button
          id="closeOrderDialog"
          class="lightbox-close"
          type="button"
          aria-label="Close order details"
          data-i18n-aria-label="adminCloseOrderDetails"
        >×</button>
        <h2 id="orderDialogTitle" data-i18n="adminOrderDetails">Order details</h2>
        <div id="orderDetails"></div>
      </div>
    </dialog>
  </body>
</html>
